    <script>
        // Dynamically build the path to target the exact repo directory
        let basePath = window.location.pathname;
        if (!basePath.endsWith('/')) {
            basePath += '/';
        }
        const csvTargetUrl = window.location.origin + basePath + 'data.csv?v=' + Math.random();
        console.log("🎯 Corrected Target Path:", csvTargetUrl);

        fetch(csvTargetUrl)
            .then(res => {
                if(!res.ok) throw new Error("Dataset file could not be read. Status: " + res.status);
                return res.text();
            })
            .then(csvData => {
                if (typeof Papa === 'undefined') {
                    throw new Error("Local PapaParse script file is missing.");
                }
                Papa.parse(csvData, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processDashboard(results.data);
                    }
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('screener-rows').innerHTML = `
                    <tr><td colspan="4" style="text-align: center; color: #f87171; font-weight: 600; padding: 16px;">⚠️ Error loading dataset file. Double check data.csv presence.</td></tr>
                `;
            });

        function processDashboard(data) {
            const tableBody = document.getElementById('screener-rows');
            tableBody.innerHTML = ""; 
            
            if(!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #9ca3af; padding: 16px;">The generated data.csv file is empty.</td></tr>`;
                return;
            }

            data.forEach(row => {
                let scoreValue = row.Forecast_Score ? parseFloat(row.Forecast_Score) : 0;
                let badgeColor = scoreValue > 15 ? 'bg-green-900' : (scoreValue < -15 ? 'bg-red-900' : '');
                
                tableBody.innerHTML += `
                    <tr class="hover:bg-gray-700">
                        <td class="font-mono text-green-400" style="font-weight: 700; padding: 12px; border-bottom: 1px solid #374151;">${row.Ticker || 'N/A'}</td>
                        <td style="padding: 12px; border-bottom: 1px solid #374151;"><div class="truncate">${row.Latest_Headline || 'No news feed logged.'}</div></td>
                        <td style="text-align: center; padding: 12px; border-bottom: 1px solid #374151;">${row.Repeat_Count || 1}</td>
                        <td style="text-align: center; padding: 12px; border-bottom: 1px solid #374151;"><div class="rounded ${badgeColor}" style="padding: 4px;">${scoreValue.toFixed(1)}</div></td>
                    </tr>
                `;
            });

            const total = data.length;
            const matches = data.filter(r => intOrZero(r.Forecast_Direction) === intOrZero(r.Actual_Direction)).length;
            const totalBullish = data.filter(r => intOrZero(r.Forecast_Direction) === 1).length;
            const realBullish = data.filter(r => intOrZero(r.Forecast_Direction) === 1 && intOrZero(r.Actual_Direction) === 1).length;

            document.getElementById('hit-rate').innerText = `${((matches / total) * 100).toFixed(1)}%`;
            document.getElementById('bullish-precision').innerText = `${totalBullish > 0 ? ((realBullish / totalBullish) * 100).toFixed(1) : 0}%`;
            document.getElementById('total-signals').innerText = `${total} items`;

            if (typeof Plotly !== 'undefined') {
                const trace = {
                    x: data.map(r => r.Forecast_Score),
                    y: data.map(r => r.Actual_Return_Pct),
                    mode: 'markers',
                    type: 'scatter',
                    text: data.map(r => r.Ticker),
                    marker: {
                        size: 14,
                        color: data.map(r => intOrZero(r.Forecast_Direction) === intOrZero(r.Actual_Direction) ? '#10B981' : '#EF4444'),
                        line: { color: '#1F2937', width: 2 }
                    }
                };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    xaxis: { title: 'Forecast Score', gridcolor: '#374151', color: '#9CA3AF' },
                    yaxis: { title: 'Realized Return %', gridcolor: '#374151', color: '#9CA3AF' },
                    margin: { t: 20, r: 20, b: 40, l: 40 }
                };

                document.getElementById('accuracy-chart').innerHTML = "";
                Plotly.newPlot('accuracy-chart', [trace], layout, {responsive: true});
            } else {
                document.getElementById('accuracy-chart').innerHTML = "<p style='color: #f87171;'>Plotly rendering engine failed to initialize.</p>";
            }
        }

        function intOrZero(val) {
            let parsed = parseInt(val);
            return isNaN(parsed) ? 0 : parsed;
        }
    </script>
