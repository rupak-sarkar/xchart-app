<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>xchart.in | AI-Powered Trading Intelligence</title>
<meta name="description" content="Multi-Layer AI Trading Engine for NSE/BSE — FinBERT sentiment, technical signals, sector macro, and backtested accuracy.">
<link rel="canonical" href="https://xchart.in/">
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0e14;--card:#151823;--card2:#1c2030;--border:#2a2e3d;
  --text:#c9d1d9;--text2:#8b949e;--white:#e6edf3;
  --bull:#22c55e;--bear:#ef4444;--neut:#eab308;--accent:#3b82f6;
  --radius:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}

/* Header */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{font-size:20px;font-weight:700;color:var(--white);letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.version{font-size:10px;background:var(--accent);color:#fff;padding:2px 6px;
  border-radius:10px;margin-left:6px;vertical-align:middle}
.global-kpis{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.gkpi{text-align:center}
.gkpi-val{font-size:14px;font-weight:700;color:var(--white)}
.gkpi-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px}

/* Ticker bar */
.ticker-bar{background:var(--card);border-bottom:1px solid var(--border);padding:6px 16px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.search-box input{padding:6px 10px;background:var(--card2);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--white);font-size:12px;outline:none;width:160px}
.search-box input:focus{border-color:var(--accent)}
.filter-btn{padding:4px 10px;font-size:10px;border:1px solid var(--border);border-radius:4px;
  background:transparent;color:var(--text2);cursor:pointer;text-transform:uppercase}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ticker-scroll{display:flex;gap:4px;overflow-x:auto;flex:1;padding:2px 0}
.ticker-scroll::-webkit-scrollbar{height:4px}
.ticker-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ticker-chip{padding:4px 10px;font-size:11px;font-weight:600;border-radius:4px;
  cursor:pointer;white-space:nowrap;border:1px solid var(--border);transition:all 0.15s;
  display:flex;align-items:center;gap:4px;background:var(--card2);color:var(--white)}
.ticker-chip:hover{border-color:var(--accent);background:var(--card)}
.ticker-chip.active{border-color:var(--accent);background:rgba(59,130,246,0.15)}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chip-bull{background:var(--bull)}.chip-bear{background:var(--bear)}.chip-neut{background:var(--neut)}

/* Main content */
.main-content{flex:1;overflow-y:auto;padding:16px}

/* Analytics grid */
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ana-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.ana-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;
  margin-bottom:10px;font-weight:600;display:flex;align-items:center;gap:6px}
.ana-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.ana-row .label{color:var(--text2)}.ana-row .value{color:var(--white);font-weight:600}
.ana-big{font-size:28px;font-weight:700;color:var(--white);margin:4px 0}
.ana-sub{font-size:11px;color:var(--text2)}

/* Top tickers table */
.top-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.top-table th{color:var(--text2);font-weight:600;text-align:left;padding:4px 6px;
  border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase}
.top-table td{padding:4px 6px;border-bottom:1px solid rgba(42,46,61,0.5);color:var(--white)}
.top-table tr:hover{background:var(--card2)}
.top-table .tk{font-weight:600;cursor:pointer;color:var(--accent)}

/* Progress bar */
.prog-bar{height:6px;border-radius:3px;background:var(--border);margin-top:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width 0.5s}

/* Chart Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;
  width:100%;max-width:1100px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:700;color:var(--white)}
.modal-subtitle{font-size:11px;color:var(--text2);margin-left:8px}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--card2);
  border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--bear);color:#fff;border-color:var(--bear)}
.modal-chart{height:400px;position:relative}
.modal-kpis{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap;border-top:1px solid var(--border)}
.mkpi{background:var(--card2);border:1px solid var(--border);border-radius:6px;
  padding:6px 12px;text-align:center;min-width:70px}
.mkpi-val{font-size:14px;font-weight:700;color:var(--white)}
.mkpi-label{font-size:9px;color:var(--text2);text-transform:uppercase}

/* Footer */
.footer{background:var(--card);border-top:1px solid var(--border);padding:8px 16px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
  gap:6px;font-size:10px;color:var(--text2)}

/* Mobile */
@media(max-width:768px){
  .header{padding:8px 12px}
  .global-kpis{gap:8px}
  .gkpi-val{font-size:12px}
  .ticker-bar{padding:6px 12px}
  .search-box input{width:120px}
  .main-content{padding:10px}
  .analytics-grid{grid-template-columns:1fr}
  .modal-chart{height:300px}
  .modal-kpis{gap:4px}
  .mkpi{min-width:60px;padding:4px 8px}
  .mkpi-val{font-size:12px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div style="display:flex;align-items:center">
    <div class="logo">x<span>chart</span>.in<span class="version">v6.3</span></div>
  </div>
  <div class="global-kpis" id="globalKpis">
    <div class="gkpi"><div class="gkpi-val" id="g-regime">—</div><div class="gkpi-label">Regime</div></div>
    <div class="gkpi"><div class="gkpi-val" id="g-accuracy">—</div><div class="gkpi-label">Accuracy</div></div>
    <div class="gkpi"><div class="gkpi-val" id="g-pf">—</div><div class="gkpi-label">Avg PF</div></div>
    <div class="gkpi"><div class="gkpi-val" id="g-tickers">—</div><div class="gkpi-label">Tickers</div></div>
    <div class="gkpi"><div class="gkpi-val" style="color:var(--bull)" id="g-bull">—</div><div class="gkpi-label">Bull</div></div>
    <div class="gkpi"><div class="gkpi-val" style="color:var(--bear)" id="g-bear">—</div><div class="gkpi-label">Bear</div></div>
    <div class="gkpi"><div class="gkpi-val" id="g-date">—</div><div class="gkpi-label">Date</div></div>
  </div>
</div>

<!-- TICKER BAR -->
<div class="ticker-bar">
  <div class="search-box"><input type="text" id="searchInput" placeholder="Search..."></div>
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="bull">Bull</button>
  <button class="filter-btn" data-filter="bear">Bear</button>
  <button class="filter-btn" data-filter="neut">Neut</button>
  <div class="ticker-scroll" id="tickerScroll"></div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content" id="mainContent"></div>

<!-- CHART MODAL -->
<div class="modal-overlay" id="chartModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <span class="modal-title" id="modalTitle">—</span>
        <span class="modal-subtitle" id="modalSubtitle"></span>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-chart" id="modalChart"></div>
    <div class="modal-kpis" id="modalKpis"></div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <div>⚠️ Not financial advice. Past performance ≠ future results.</div>
  <div style="display:flex;align-items:center;gap:8px">
    <span>© 2026 xchart.in</span>
    <span>·</span>
    <span>Charts by <a href="https://www.tradingview.com/" target="_blank">TradingView</a></span>
  </div>
</div>

<script>
let allData=[], meta={}, chart=null, candleSeries=null, selectedTicker=null;

// ─── HELPERS ───
function dir(row){
  const d=parseInt(row.Composite_Direction||row.Forecast_Direction||0);
  return d===1?'bull':d===-1?'bear':'neut';
}
function dirLabel(d){return d==='bull'?'BULL':d==='bear'?'BEAR':'NEUT'}
function pf(v){return parseFloat(v||0)}
function sc(v,n){return pf(v).toFixed(n||0)}
function signColor(v){return v>0?'var(--bull)':v<0?'var(--bear)':'var(--text2)'}
function sign(v){return v>0?'+'+v:v}

// ─── INIT ───
function init(){
  fetch('meta.json').then(r=>r.json()).then(m=>{
    meta=m;
    document.getElementById('g-regime').textContent=m.regime||'—';
    document.getElementById('g-accuracy').textContent=m.direction_accuracy?m.direction_accuracy+'%':'—';
    document.getElementById('g-pf').textContent=m.avg_pf||'—';
    document.getElementById('g-tickers').textContent=m.total_tickers||'—';
    document.getElementById('g-bull').textContent=m.bull_count||0;
    document.getElementById('g-bear').textContent=m.bear_count||0;
    document.getElementById('g-date').textContent=m.date||'—';
    const el=document.getElementById('g-regime');
    if(m.regime==='BULL'||m.regime==='STRONG_BULL')el.style.color='var(--bull)';
    else if(m.regime==='BEAR'||m.regime==='STRONG_BEAR')el.style.color='var(--bear)';
    else el.style.color='var(--neut)';
  }).catch(()=>{});

  Papa.parse('data.csv',{download:true,header:true,complete:function(r){
    allData=r.data.filter(r=>r.Ticker&&r.Ticker.trim());
    buildTickerBar();
    showOverallAnalytics();
  }});
}

// ─── TICKER BAR ───
function buildTickerBar(filter='all',search=''){
  const scroll=document.getElementById('tickerScroll');
  scroll.innerHTML='';
  const s=search.toLowerCase();
  const sorted=[...allData].sort((a,b)=>{
    const da=dir(a),db=dir(b);
    const o={bull:0,bear:1,neut:2};
    if(o[da]!==o[db])return o[da]-o[db];
    return(a.Ticker||'').localeCompare(b.Ticker||'');
  });
  sorted.forEach(row=>{
    const tk=row.Ticker, d=dir(row);
    if(filter!=='all'&&d!==filter)return;
    if(s&&!tk.toLowerCase().includes(s))return;
    const chip=document.createElement('div');
    chip.className='ticker-chip'+(tk===selectedTicker?' active':'');
    chip.innerHTML=`<span class="chip-dot chip-${d}"></span>${tk}`;
    chip.onclick=()=>selectTicker(tk);
    scroll.appendChild(chip);
  });
}

// ─── SEARCH & FILTER ───
document.getElementById('searchInput').addEventListener('input',function(){
  const f=document.querySelector('.filter-btn.active')?.dataset.filter||'all';
  buildTickerBar(f,this.value);
});
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    buildTickerBar(this.dataset.filter,document.getElementById('searchInput').value);
  });
});

// ─── OVERALL ANALYTICS ───
function showOverallAnalytics(){
  const bulls=allData.filter(r=>dir(r)==='bull');
  const bears=allData.filter(r=>dir(r)==='bear');
  const neuts=allData.filter(r=>dir(r)==='neut');

  // Top by PF
  const byPF=[...allData].filter(r=>pf(r.TR_total_trades)>=5)
    .sort((a,b)=>pf(b.TR_profit_factor)-pf(a.TR_profit_factor));
  const topPF=byPF.slice(0,10);
  const botPF=byPF.slice(-10).reverse();

  // Top by accuracy
  const byAcc=[...allData].filter(r=>pf(r.BT_Total_Preds)>=30)
    .sort((a,b)=>pf(b.BT_6M)-pf(a.BT_6M));
  const topAcc=byAcc.slice(0,10);

  // Category stats
  const cats=['MEGA','LARGE','MID','SMALL'];
  let catRows='';
  cats.forEach(c=>{
    const items=allData.filter(r=>(r.BT_Category||'')==c&&pf(r.TR_total_trades)>=5);
    if(!items.length)return;
    const avgPF=items.reduce((s,r)=>s+pf(r.TR_profit_factor),0)/items.length;
    const avgWR=items.reduce((s,r)=>s+pf(r.TR_win_rate),0)/items.length;
    const avgAcc=items.reduce((s,r)=>s+pf(r.BT_6M),0)/items.length;
    const pfColor=avgPF>=1.1?'var(--bull)':avgPF<0.95?'var(--bear)':'var(--white)';
    catRows+=`<tr>
      <td style="font-weight:600">${c}</td>
      <td>${items.length}</td>
      <td>${avgAcc.toFixed(1)}%</td>
      <td>${avgWR.toFixed(1)}%</td>
      <td style="color:${pfColor}">${avgPF.toFixed(2)}</td>
    </tr>`;
  });

  document.getElementById('mainContent').innerHTML=`
    <div class="analytics-grid">
      <!-- Signal Summary -->
      <div class="ana-card">
        <div class="ana-title">📊 Signal Summary</div>
        <div style="display:flex;gap:16px;margin-bottom:10px">
          <div><div class="ana-big" style="color:var(--bull)">${bulls.length}</div><div class="ana-sub">Bullish</div></div>
          <div><div class="ana-big" style="color:var(--bear)">${bears.length}</div><div class="ana-sub">Bearish</div></div>
          <div><div class="ana-big" style="color:var(--neut)">${neuts.length}</div><div class="ana-sub">Neutral</div></div>
        </div>
        <div class="prog-bar"><div class="prog-fill" style="width:${bulls.length/allData.length*100}%;background:var(--bull)"></div></div>
        <div style="font-size:10px;color:var(--text2);margin-top:4px">
          Bull ${(bulls.length/allData.length*100).toFixed(0)}% · 
          Bear ${(bears.length/allData.length*100).toFixed(0)}% · 
          Neut ${(neuts.length/allData.length*100).toFixed(0)}%
        </div>
      </div>

      <!-- Market Regime -->
      <div class="ana-card">
        <div class="ana-title">🌍 Market Regime</div>
        <div class="ana-big" style="color:var(--neut)">${meta.regime||'—'}</div>
        <div class="ana-sub">${meta.regime_detail||''}</div>
        <div style="margin-top:10px">
          <div class="ana-row"><span class="label">Accuracy</span><span class="value">${meta.direction_accuracy||0}%</span></div>
          <div class="ana-row"><span class="label">Avg Trade PF</span><span class="value">${meta.avg_pf||0}</span></div>
          <div class="ana-row"><span class="label">Engine</span><span class="value">v${meta.version||'6.3'}</span></div>
        </div>
      </div>

      <!-- Category Performance -->
      <div class="ana-card" style="grid-column:span 2">
        <div class="ana-title">📈 Category Performance</div>
        <table class="top-table">
          <tr><th>Category</th><th>Tickers</th><th>Dir Acc</th><th>Win Rate</th><th>Trade PF</th></tr>
          ${catRows}
        </table>
      </div>

      <!-- Top Profitable -->
      <div class="ana-card">
        <div class="ana-title">🏆 Top 10 Profitable (by PF)</div>
        <table class="top-table">
          <tr><th>Ticker</th><th>Cat</th><th>PF</th><th>WR</th><th>Return</th></tr>
          ${topPF.map(r=>`<tr>
            <td class="tk" onclick="selectTicker('${r.Ticker}')">${r.Ticker}</td>
            <td>${r.BT_Category||''}</td>
            <td style="color:var(--bull)">${sc(r.TR_profit_factor,2)}</td>
            <td>${sc(r.TR_win_rate,0)}%</td>
            <td style="color:${pf(r.TR_total_return_pct)>0?'var(--bull)':'var(--bear)'}">
              ${pf(r.TR_total_return_pct)>0?'+':''}${sc(r.TR_total_return_pct,1)}%</td>
          </tr>`).join('')}
        </table>
      </div>

      <!-- Bottom Profitable -->
      <div class="ana-card">
        <div class="ana-title">⚠️ Bottom 10 (by PF)</div>
        <table class="top-table">
          <tr><th>Ticker</th><th>Cat</th><th>PF</th><th>WR</th><th>Return</th></tr>
          ${botPF.map(r=>`<tr>
            <td class="tk" onclick="selectTicker('${r.Ticker}')">${r.Ticker}</td>
            <td>${r.BT_Category||''}</td>
            <td style="color:var(--bear)">${sc(r.TR_profit_factor,2)}</td>
            <td>${sc(r.TR_win_rate,0)}%</td>
            <td style="color:var(--bear)">${sc(r.TR_total_return_pct,1)}%</td>
          </tr>`).join('')}
        </table>
      </div>

      <!-- Top Accurate -->
      <div class="ana-card" style="grid-column:span 2">
        <div class="ana-title">🎯 Top 10 Most Accurate (All-Time Direction)</div>
        <table class="top-table">
          <tr><th>Ticker</th><th>Cat</th><th>1M Acc</th><th>3M Acc</th><th>All Acc</th><th>Trades</th><th>PF</th></tr>
          ${topAcc.map(r=>`<tr>
            <td class="tk" onclick="selectTicker('${r.Ticker}')">${r.Ticker}</td>
            <td>${r.BT_Category||''}</td>
            <td>${sc(r.BT_1M,0)}%</td>
            <td>${sc(r.BT_3M,0)}%</td>
            <td style="font-weight:700">${sc(r.BT_6M,0)}%</td>
            <td>${sc(r.TR_total_trades,0)}</td>
            <td style="color:${pf(r.TR_profit_factor)>=1.1?'var(--bull)':'var(--white)'}">${sc(r.TR_profit_factor,2)}</td>
          </tr>`).join('')}
        </table>
      </div>
    </div>
  `;
}

// ─── TICKER ANALYTICS ───
function showTickerAnalytics(row){
  const tk=row.Ticker;
  const d=dir(row);
  const comp=pf(row.Composite_Score);
  const tech=parseInt(row.Technical_Score||0);
  const macro=parseInt(row.Macro_Score||0);
  const fund=parseInt(row.Fundamental_Score||0);
  const news=pf(row.Forecast_Score);

  document.getElementById('mainContent').innerHTML=`
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span style="font-size:20px;font-weight:700;color:var(--white)">${tk}</span>
      <span style="font-size:12px;padding:3px 10px;border-radius:4px;font-weight:700;
        background:${d==='bull'?'rgba(34,197,94,0.15)':d==='bear'?'rgba(239,68,68,0.15)':'rgba(234,179,8,0.1)'};
        color:var(--${d})">${dirLabel(d)}</span>
      <span style="font-size:13px;color:var(--text2)">${row.BT_Category||''} · ${row.Sector||''}</span>
      <button onclick="openChart('${tk}')" style="margin-left:auto;padding:6px 16px;border-radius:6px;
        background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:600">
        📈 Open Chart</button>
      <button onclick="selectedTicker=null;buildTickerBar();showOverallAnalytics()" style="padding:6px 12px;
        border-radius:6px;background:var(--card2);color:var(--text);border:1px solid var(--border);
        cursor:pointer;font-size:12px">← Back</button>
    </div>
    <div class="analytics-grid">
      <!-- Composite Score -->
      <div class="ana-card">
        <div class="ana-title">📊 Score Breakdown</div>
        <div class="ana-big" style="color:${signColor(comp)}">${comp>0?'+':''}${comp.toFixed(1)}</div>
        <div class="ana-sub">Composite Score</div>
        <div style="margin-top:10px">
          <div class="ana-row"><span class="label">Technical</span>
            <span class="value" style="color:${signColor(tech)}">${sign(tech)}</span></div>
          <div class="ana-row"><span class="label">Macro / Sector</span>
            <span class="value" style="color:${signColor(macro)}">${sign(macro)}</span></div>
          <div class="ana-row"><span class="label">Fundamental</span>
            <span class="value" style="color:${signColor(fund)}">${sign(fund)}</span></div>
          <div class="ana-row"><span class="label">News Sentiment</span>
            <span class="value" style="color:${signColor(news)}">${news>0?'+':''}${news.toFixed(1)}</span></div>
          <div class="ana-row"><span class="label">Severity</span>
            <span class="value">${row.Composite_Severity||row.Severity||'—'}</span></div>
          <div class="ana-row"><span class="label">Quality</span>
            <span class="value">${row.Signal_Quality||'—'}</span></div>
        </div>
      </div>

      <!-- Backtest -->
      <div class="ana-card">
        <div class="ana-title">🎯 Backtest Accuracy</div>
        <div class="ana-big">${sc(row.BT_6M,0)}%</div>
        <div class="ana-sub">All-Time Direction Accuracy</div>
        <div style="margin-top:10px">
          <div class="ana-row"><span class="label">1 Month</span><span class="value">${sc(row.BT_1M,0)}%</span></div>
          <div class="ana-row"><span class="label">3 Month</span><span class="value">${sc(row.BT_3M,0)}%</span></div>
          <div class="ana-row"><span class="label">Horizon</span><span class="value">${row.BT_Forward_Days||'—'} days</span></div>
          <div class="ana-row"><span class="label">Neutral Band</span><span class="value">±${sc(row.BT_Threshold,2)}%</span></div>
          <div class="ana-row"><span class="label">ATR</span><span class="value">${sc(row.BT_ATR_Pct,1)}%</span></div>
          <div class="ana-row"><span class="label">Total Predictions</span><span class="value">${sc(row.BT_Total_Preds,0)}</span></div>
        </div>
      </div>

      <!-- Trade Simulation -->
      <div class="ana-card">
        <div class="ana-title">💰 Trade Simulation</div>
        <div class="ana-big" style="color:${pf(row.TR_profit_factor)>=1.1?'var(--bull)':pf(row.TR_profit_factor)<0.9?'var(--bear)':'var(--white)'}">
          ${sc(row.TR_profit_factor,2)}</div>
        <div class="ana-sub">Profit Factor</div>
        <div style="margin-top:10px">
          <div class="ana-row"><span class="label">Total Trades</span><span class="value">${sc(row.TR_total_trades,0)}</span></div>
          <div class="ana-row"><span class="label">Win Rate</span><span class="value">${sc(row.TR_win_rate,0)}%</span></div>
          <div class="ana-row"><span class="label">Avg Win</span>
            <span class="value" style="color:var(--bull)">+${sc(row.TR_avg_win_pct,1)}%</span></div>
          <div class="ana-row"><span class="label">Avg Loss</span>
            <span class="value" style="color:var(--bear)">-${sc(row.TR_avg_loss_pct,1)}%</span></div>
          <div class="ana-row"><span class="label">Total Return</span>
            <span class="value" style="color:${pf(row.TR_total_return_pct)>0?'var(--bull)':'var(--bear)'}">
              ${pf(row.TR_total_return_pct)>0?'+':''}${sc(row.TR_total_return_pct,1)}%</span></div>
          <div class="ana-row"><span class="label">Avg Hold</span><span class="value">${sc(row.TR_avg_holding_days,0)} days</span></div>
          <div class="ana-row"><span class="label">Stop-Loss</span><span class="value">${sc(row.BT_SL_Level,1)}%</span></div>
          <div class="ana-row"><span class="label">SL Exits</span><span class="value">${sc(row.TR_stop_loss_exits,0)}</span></div>
        </div>
      </div>

      <!-- Context -->
      <div class="ana-card">
        <div class="ana-title">📈 Context</div>
        <div style="margin-top:4px">
          <div class="ana-row"><span class="label">Sector</span><span class="value">${row.Sector||'—'}</span></div>
          <div class="ana-row"><span class="label">Category</span><span class="value">${row.BT_Category||'—'}</span></div>
          <div class="ana-row"><span class="label">Streak</span><span class="value">${row.Streak_Days||0} days</span></div>
          <div class="ana-row"><span class="label">Momentum</span><span class="value">${row.Momentum||'—'}</span></div>
          <div class="ana-row"><span class="label">Long WR</span><span class="value">${sc(row.TR_long_win_rate,0)}%</span></div>
          <div class="ana-row"><span class="label">Short WR</span><span class="value">${sc(row.TR_short_win_rate,0)}%</span></div>
        </div>
        ${row.Latest_Headline?`<div style="margin-top:10px;padding:8px;background:var(--card2);
          border-radius:6px;font-size:11px;color:var(--text2);line-height:1.5">
          📰 ${row.Latest_Headline}</div>`:''}
        ${row.Macro_Context?`<div style="margin-top:6px;font-size:11px;color:var(--text2)">
          🌍 ${row.Macro_Context}</div>`:''}
      </div>
    </div>
  `;
}

// ─── SELECT TICKER ───
function selectTicker(ticker){
  selectedTicker=ticker;
  buildTickerBar(document.querySelector('.filter-btn.active')?.dataset.filter||'all',
    document.getElementById('searchInput').value);
  const row=allData.find(r=>r.Ticker===ticker);
  if(row) showTickerAnalytics(row);
}

// ─── CHART MODAL ───
function openChart(ticker){
  const row=allData.find(r=>r.Ticker===ticker)||{};
  const d=dir(row);
  const modal=document.getElementById('chartModal');
  document.getElementById('modalTitle').textContent=ticker;
  document.getElementById('modalSubtitle').textContent=
    `${row.BT_Category||''} · ${row.Sector||''} · Composite: ${sign(sc(row.Composite_Score,1))}`;

  // KPIs
  document.getElementById('modalKpis').innerHTML=`
    <div class="mkpi"><div class="mkpi-val" style="color:var(--${d})">${dirLabel(d)}</div><div class="mkpi-label">Signal</div></div>
    <div class="mkpi"><div class="mkpi-val">${sc(row.BT_6M,0)}%</div><div class="mkpi-label">Accuracy</div></div>
    <div class="mkpi"><div class="mkpi-val" style="color:${pf(row.TR_profit_factor)>=1.1?'var(--bull)':'var(--white)'}">
      ${sc(row.TR_profit_factor,2)}</div><div class="mkpi-label">Trade PF</div></div>
    <div class="mkpi"><div class="mkpi-val">${sc(row.TR_win_rate,0)}%</div><div class="mkpi-label">Win Rate</div></div>
    <div class="mkpi"><div class="mkpi-val" style="color:${pf(row.TR_total_return_pct)>0?'var(--bull)':'var(--bear)'}">
      ${pf(row.TR_total_return_pct)>0?'+':''}${sc(row.TR_total_return_pct,1)}%</div><div class="mkpi-label">Return</div></div>
    <div class="mkpi"><div class="mkpi-val">${sc(row.BT_ATR_Pct,1)}%</div><div class="mkpi-label">ATR</div></div>
    <div class="mkpi"><div class="mkpi-val">${sc(row.TR_avg_holding_days,0)}d</div><div class="mkpi-label">Hold</div></div>
  `;

  modal.classList.add('show');

  // Destroy old chart
  if(chart){chart.remove();chart=null;candleSeries=null;}

  // Load chart data
  fetch(`charts/${ticker}.json`)
    .then(r=>r.json())
    .then(data=>{
      const container=document.getElementById('modalChart');
      chart=LightweightCharts.createChart(container,{
        width:container.clientWidth,height:container.clientHeight,
        layout:{background:{type:'solid',color:'#151823'},textColor:'#8b949e',fontSize:11},
        grid:{vertLines:{color:'#1a1d29'},horzLines:{color:'#1a1d29'}},
        crosshair:{mode:LightweightCharts.CrosshairMode.Normal,
          vertLine:{color:'#3b82f6',width:1,style:2,labelBackgroundColor:'#3b82f6'},
          horzLine:{color:'#3b82f6',width:1,style:2,labelBackgroundColor:'#3b82f6'}},
        rightPriceScale:{borderColor:'#2a2e3d'},
        timeScale:{borderColor:'#2a2e3d',timeVisible:false},
      });
      candleSeries=chart.addCandlestickSeries({
        upColor:'#22c55e',downColor:'#ef4444',
        borderUpColor:'#22c55e',borderDownColor:'#ef4444',
        wickUpColor:'#22c55e88',wickDownColor:'#ef444488',
      });
      if(data.ohlc&&data.ohlc.length>0){
        candleSeries.setData(data.ohlc);
        if(data.markers&&data.markers.length>0) candleSeries.setMarkers(data.markers);
        chart.timeScale().fitContent();
      }
      const ro=new ResizeObserver(()=>{
        chart.applyOptions({width:container.clientWidth,height:container.clientHeight});
      });
      ro.observe(container);
    })
    .catch(()=>{
      document.getElementById('modalChart').innerHTML=
        '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2)">No chart data</div>';
    });
}

// Close modal
document.getElementById('modalClose').addEventListener('click',()=>{
  document.getElementById('chartModal').classList.remove('show');
  if(chart){chart.remove();chart=null;candleSeries=null;}
});
document.getElementById('chartModal').addEventListener('click',(e)=>{
  if(e.target===document.getElementById('chartModal')){
    document.getElementById('chartModal').classList.remove('show');
    if(chart){chart.remove();chart=null;candleSeries=null;}
  }
});

// ESC to close
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    document.getElementById('chartModal').classList.remove('show');
    if(chart){chart.remove();chart=null;candleSeries=null;}
  }
});

init();
</script>
</body>
</html>
