name: Fetch Stock Data

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance feedparser

      - name: Smart data sync
        run: python -c "from engine.data_fetcher import ensure_data_exists; ensure_data_exists()"

      - name: Commit and push
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "📊 Data sync $(date -u +%Y-%m-%d)"
          git pull --rebase origin master || git pull origin master
          git push
