name: Data Engine Auto-Refresh
on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  run-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Initialize Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install pandas yfinance feedparser

    - name: Download JavaScript Libraries via Curl
      run: |
        curl -sL https://cloudflare.com -o papaparse.min.js
        curl -sL https://cloudflare.com -o plotly.min.js

    - name: Generate Fresh CSV Dataset
      run: python app.py

    - name: Push Data and Dependencies Back to Repository
      run: |
        git config --global user.name "GitHub Actions Automation"
        git config --global user.email "actions@github.com"
        git add data.csv papaparse.min.js plotly.min.js
        git commit -m "Data engine auto-refresh and script updates" || exit 0
        git push
