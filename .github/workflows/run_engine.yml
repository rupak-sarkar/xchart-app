name: Data Engine Auto-Refresh

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 9:00 AM IST
    - cron: '0 8 * * 1-5'    # 1:30 PM IST
    - cron: '0 11 * * 1-5'   # 4:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Initialize Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Cache FinBERT Model Weights
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: finbert-model-v1
        restore-keys: finbert-model-

    - name: Install AI Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance feedparser transformers requests
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Verify Ticker List Exists
      run: |
        if [ ! -f tickers.csv ]; then
          echo "⚠️ tickers.csv not found — app.py will use defaults"
        else
          TICKER_COUNT=$(tail -n +2 tickers.csv | wc -l)
          echo "✅ tickers.csv: $TICKER_COUNT tickers loaded"
        fi

    - name: Run FinBERT Engine
      run: python app.py

    - name: Verify Output
      run: |
        if [ ! -f data.csv ]; then
          echo "❌ FATAL: data.csv was not generated!"
          exit 1
        fi
        echo "✅ data.csv: $(tail -n +2 data.csv | wc -l) rows"
        if [ -f history.csv ]; then
          echo "✅ history.csv: $(tail -n +2 history.csv | wc -l) rows"
        fi

    - name: Push Data Back to Repository
      run: |
        git config --global user.name "GitHub Actions Automation"
        git config --global user.email "actions@github.com"
        git add data.csv history.csv
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        git diff --cached --quiet && echo "No changes" && exit 0
        git commit -m "📊 Updated data.csv + history.csv [$(date -u +'%Y-%m-%d %H:%M UTC')]"
        git push origin "$CURRENT_BRANCH"
