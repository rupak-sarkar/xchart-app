name: Run Trading Engine

on:
  schedule:
    - cron: '30 12 * * 1-5'
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean pycache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Ensure output dirs
        run: mkdir -p output/charts

      - name: Run engine
        run: python app.py
        env:
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Verify outputs
        run: |
          echo "=== Output files ==="
          ls -la output/ 2>/dev/null || echo "No output/"
          echo ""
          echo "=== meta.json ==="
          cat output/meta.json 2>/dev/null || echo "No meta.json"
          echo ""
          echo "=== Charts count ==="
          ls output/charts/*.json 2>/dev/null | wc -l || echo "No charts"

      - name: Commit results
        run: |
          git config --global user.name "GitHub Actions Automation"
          git config --global user.email "actions@github.com"
          git add output/ 2>/dev/null || true
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git diff --cached --quiet || git commit -m "Engine v7.4 update ${TIMESTAMP}"
          git push || echo "Nothing to push"
