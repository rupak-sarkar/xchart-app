name: Run Prediction Engine

on:
  schedule:
    # Every weekday at 4:30 AM UTC (10:00 AM IST)
    - cron: '30 4 * * 1-5'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance feedparser requests beautifulsoup4 transformers torch

      - name: Run engine
        run: python app.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🔄 Engine update $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase origin master
          git push
