name: Data Engine Auto-Refresh
on:
  schedule:
    - cron: '0 15 * * 1-5' # Automatically updates at 3 PM UTC
  workflow_dispatch:      # Allows manual execution anytime

jobs:
  run-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Initialize Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install AI Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance feedparser torch transformers

    - name: Run FinBERT Engine
      run: python app.py

    - name: Push Data Back to Repository
      run: |
        git config --global user.name "GitHub Actions Automation"
        git config --global user.email "actions@github.com"
        git add data.csv
        git commit -m "Auto-updated data via FinBERT Pipeline" || exit 0
        git push origin master
