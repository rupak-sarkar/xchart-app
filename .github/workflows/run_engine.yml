name: Data Engine Auto-Refresh

on:
  schedule:
    # 3x daily during trading hours (IST = UTC + 5:30)
    # 9:00 AM IST (pre-market sentiment)  = 03:30 UTC
    # 1:30 PM IST (midday shift)          = 08:00 UTC
    # 4:30 PM IST (post-close EOD)        = 11:00 UTC
    - cron: '30 3 * * 1-5'
    - cron: '0 8 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:  # Allows manual execution anytime

# CRITICAL: Grant write permissions so git push works
permissions:
  contents: write

jobs:
  run-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Updated for 172 tickers (~17 min processing + 3 min setup buffer)

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Initialize Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # Cache FinBERT model weights (~500 MB) — avoids re-downloading every run
    - name: Cache FinBERT Model Weights
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: finbert-model-v1
        restore-keys: finbert-model-

    # CPU-only PyTorch (~200 MB vs ~2.2 GB full CUDA build)
    - name: Install AI Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance feedparser transformers
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Run FinBERT Engine
      run: python app.py

    # Validate output before committing
    - name: Verify Output Integrity
      run: |
        if [ ! -f data.csv ]; then
          echo "❌ FATAL: data.csv was not generated by the engine!"
          exit 1
        fi
        ROW_COUNT=$(tail -n +2 data.csv | wc -l)
        echo "✅ data.csv exists — $ROW_COUNT data rows"
        if [ "$ROW_COUNT" -lt 10 ]; then
          echo "⚠️ WARNING: Only $ROW_COUNT rows generated — expected ~172. Possible API failures."
        fi
        head -5 data.csv

    # Auto-detect branch name instead of hardcoding master/main
    - name: Push Data Back to Repository
      run: |
        git config --global user.name "GitHub Actions Automation"
        git config --global user.email "actions@github.com"
        git add data.csv
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        git diff --cached --quiet && echo "No changes to commit" && exit 0
        git commit -m "📊 Auto-updated data.csv — $(tail -n +2 data.csv | wc -l) tickers [$(date -u +'%Y-%m-%d %H:%M UTC')]"
        git push origin "$CURRENT_BRANCH"
