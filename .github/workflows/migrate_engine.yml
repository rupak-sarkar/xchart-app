name: Migrate Engine to Private Repo
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run engine migration
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        run: python migrate_engine.py

      - name: Commit removal of engine files
        run: |
          git config user.name "GitHub Actions Automation"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Remove engine files (moved to private repo)"
          git pull --rebase origin master
          git push
