name: SEBI Compliance Migration (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pandas
        run: pip install pandas

      - name: Run SEBI migration
        run: python migrate_sebi.py

      - name: Show changes
        run: |
          echo "=== Changed files ==="
          git diff --name-only
          git diff --cached --name-only
          echo ""
          echo "=== New files ==="
          git ls-files --others --exclude-standard

      - name: Commit
        run: |
          git config --global user.name "GitHub Actions Automation"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "SEBI compliance: labels + backtest page + fixes"
          git push
