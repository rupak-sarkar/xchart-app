name: Update Ticker List from Screener.in

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write

jobs:
  scrape-tickers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests beautifulsoup4 pandas

    - name: Scrape Screener.in and Update tickers.csv
      run: python scrape_tickers.py

    - name: Verify Output
      run: |
        if [ ! -f tickers.csv ]; then
          echo "FATAL: tickers.csv not generated!"
          exit 1
        fi
        TICKER_COUNT=$(tail -n +2 tickers.csv | wc -l)
        echo "tickers.csv: $TICKER_COUNT tickers"
        head -10 tickers.csv

    - name: Commit Updated Ticker List
      run: |
        git config --global user.name "GitHub Actions Automation"
        git config --global user.email "actions@github.com"
        git add tickers.csv
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        git diff --cached --quiet && echo "No changes to tickers" && exit 0
        git commit -m "Updated tickers.csv from Screener.in [$(date -u +'%Y-%m-%d')]"
        git pull --rebase origin "$CURRENT_BRANCH"
        git push origin "$CURRENT_BRANCH"
