name: Swap Pages (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run page swap
        run: python swap_pages.py

      - name: Commit
        run: |
          git config --global user.name "GitHub Actions Automation"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Swap pages: backtest=homepage, dashboard=premium tab"
          git push
