name: ML Model Training

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

jobs:
  ml-train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout engine (private repo)
        uses: actions/checkout@v4
        with:
          repository: rupak-sarkar/xchart-engine
          path: engine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance feedparser requests beautifulsoup4 lightgbm scikit-learn

      - name: Run ML pipeline
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/engine
          python ml_run.py

      - name: Commit and push
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ml_predictions.csv ensemble_predictions.csv 2>/dev/null || true
          git add -u
          git diff --staged --quiet || git commit -m "🤖 ML+Ensemble update $(date -u +%Y-%m-%d)"
          git stash 2>/dev/null || true
          git pull --rebase origin master
          git stash pop 2>/dev/null || true
          git push
