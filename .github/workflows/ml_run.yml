name: ML Model Training

on:
  schedule:
    # Every Saturday at 6:00 AM UTC (11:30 AM IST)
    - cron: '0 6 * * 6'
  workflow_dispatch:

jobs:
  ml-train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance feedparser requests beautifulsoup4 lightgbm scikit-learn

      - name: Run ML pipeline
        run: python ml_run.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ml_predictions.csv ensemble_predictions.csv
          git diff --staged --quiet || git commit -m "🤖 ML+Ensemble update $(date -u +%Y-%m-%d)"
          git pull --rebase origin master
          git push
