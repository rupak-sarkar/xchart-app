<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera — agentic IDE prototype</title>
<!--
  Tessera: a learning prototype of an agentic IDE.
  One file, no dependencies. Everything is simulated in the browser:
  the "agent" picks a canned scenario, the terminal understands a few
  commands, and nothing is saved between page loads.

  Structure of this file
    1. CSS   — design tokens, layout, components
    2. HTML  — static shell (title bar, editor view, manager view, status bar)
    3. JS    — data, renderers, simulated agent, event wiring
-->
<style>
/* ---------- 1. Design tokens ---------- */
:root {
  --bg: #111318;      /* editor surface */
  --bg-2: #171a20;    /* side panels, bars */
  --bg-3: #1d2129;    /* raised cards, inputs */
  --bg-4: #272c36;    /* hover */
  --line: #2a2f3a;
  --tx: #e4e7ec;
  --tx-2: #a3abb8;
  --tx-3: #6f7785;
  --ac: #ff8f5e;
  --ac-ink: #1c0f08;
  --ac-soft: rgba(255, 143, 94, .14);
  --ok: #4cc38a;
  --warn: #e5b454;
  --err: #f2777a;
  --add: rgba(76, 195, 138, .15);
  --del: rgba(242, 119, 122, .15);
  --s-kw: #c39bff; --s-str: #8fd694; --s-num: #f0b866; --s-com: #6f7785;
  --s-fn: #7cb7ff; --s-prop: #5fd0c5; --s-tag: #ff9d7a;
  --shadow: 0 18px 50px rgba(0, 0, 0, .5);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
  --code-size: 12.5px;
  --sb-w: 240px;      /* sidebar width  (resizable) */
  --ag-w: 360px;      /* agent width    (resizable) */
  --pn-h: 190px;      /* panel height   (resizable) */
}
:root[data-theme="light"] {
  --bg: #ffffff; --bg-2: #f5f4f1; --bg-3: #ffffff; --bg-4: #e9e7e1;
  --line: #dedbd3;
  --tx: #1d1f24; --tx-2: #555b66; --tx-3: #8a8f99;
  --ac: #cf4f1b; --ac-ink: #ffffff; --ac-soft: rgba(207, 79, 27, .10);
  --ok: #1f8f5c; --warn: #a06f08; --err: #c93b40;
  --add: rgba(31, 143, 92, .13); --del: rgba(201, 59, 64, .12);
  --s-kw: #7a3fd0; --s-str: #2a7d3f; --s-num: #a9620a; --s-com: #8a8f99;
  --s-fn: #1f5fc4; --s-prop: #0f7f78; --s-tag: #c2481a;
  --shadow: 0 18px 50px rgba(30, 25, 15, .18);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--tx); font: 13px/1.45 var(--sans); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: -2px; }
.ic { flex: none; display: block; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--tx-3); }

#app { display: grid; grid-template-rows: 40px minmax(0, 1fr) 24px; height: 100vh; }

/* ---------- Title bar ---------- */
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--bg-2); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: .01em; }
.menus { display: flex; }
.menus button { padding: 4px 8px; border-radius: 5px; color: var(--tx-2); }
.menus button:hover { background: var(--bg-4); color: var(--tx); }
.cmdbox { flex: 1; max-width: 440px; margin: 0 auto; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg-3); color: var(--tx-3); min-width: 0; }
.cmdbox span { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdbox:hover { border-color: var(--tx-3); }
.seg { display: flex; padding: 2px; border-radius: 7px; background: var(--bg-3); border: 1px solid var(--line); }
.seg button { padding: 2px 12px; border-radius: 5px; color: var(--tx-2); }
.seg button[aria-pressed="true"] { background: var(--ac-soft); color: var(--ac); font-weight: 600; }
.tb-actions { display: flex; gap: 2px; }
.ib { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--tx-2); }
.ib:hover { background: var(--bg-4); color: var(--tx); }

/* ---------- Editor view layout ---------- */
.view { min-height: 0; min-width: 0; }
#editorView { display: flex; }
.activity { width: 48px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; background: var(--bg-2); border-right: 1px solid var(--line); }
.activity button { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--tx-3); position: relative; }
.activity button:hover { color: var(--tx); }
.activity button[aria-pressed="true"] { color: var(--ac); background: var(--ac-soft); }
.activity .sp { flex: 1; }
.badge { position: absolute; top: 3px; right: 3px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--ac); color: var(--ac-ink); font: 600 10px/15px var(--sans); }

.sidebar { width: var(--sb-w); flex: none; display: flex; flex-direction: column; background: var(--bg-2); min-width: 0; }
.pane-head { display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 6px 0 12px; flex: none; }
.ph-title { flex: 1; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--tx-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-body { flex: 1; overflow: auto; padding-bottom: 10px; }
.row { display: flex; align-items: center; gap: 6px; width: 100%; height: 24px; padding: 0 10px; text-align: left; color: var(--tx-2); white-space: nowrap; }
.row:hover { background: var(--bg-4); color: var(--tx); }
.row.on { background: var(--ac-soft); color: var(--tx); }
.row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.row .chev { transition: transform .12s; }
.row.open .chev { transform: rotate(90deg); }
.ft { flex: none; width: 20px; text-align: center; font: 700 9px var(--mono); }
.ft.js { color: var(--s-num); } .ft.css { color: var(--s-fn); } .ft.html { color: var(--s-tag); }
.ft.json { color: var(--s-str); } .ft.md { color: var(--s-kw); }
.mark { font: 600 11px var(--mono); }
.mark.m { color: var(--warn); } .mark.r { color: var(--ac); }
.side-pad { padding: 4px 12px; }
.field { width: 100%; height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-3); }
.field:focus { outline: none; border-color: var(--ac); }
textarea.field { height: auto; padding: 7px 9px; resize: none; }
.hint { color: var(--tx-3); font-size: 12px; padding: 8px 12px; }
.sub { padding: 10px 12px 4px; font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--tx-3); }
.res { display: block; width: 100%; padding: 4px 12px; text-align: left; }
.res:hover { background: var(--bg-4); }
.res b { display: block; font-weight: 500; font-size: 12px; color: var(--tx-2); }
.res code { display: block; font: 11.5px var(--mono); color: var(--tx-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ext { display: flex; gap: 10px; align-items: center; padding: 8px 12px; }
.ext .sq { width: 30px; height: 30px; border-radius: 8px; background: var(--bg-4); display: grid; place-items: center; color: var(--tx-2); flex: none; }
.ext div { flex: 1; min-width: 0; } .ext small { display: block; color: var(--tx-3); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; }

.btn { height: 26px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg-3); white-space: nowrap; }
.btn:hover { border-color: var(--tx-3); }
.btn.primary { background: var(--ac); border-color: var(--ac); color: var(--ac-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 22px; padding: 0 8px; font-size: 12px; }
.btn.block { width: 100%; }

.resizer { flex: none; background: var(--line); z-index: 2; touch-action: none; }
.resizer.v { width: 1px; cursor: col-resize; position: relative; }
.resizer.v::after { content: ""; position: absolute; inset: 0 -3px; }
.resizer.h { height: 1px; cursor: row-resize; position: relative; }
.resizer.h::after { content: ""; position: absolute; inset: -3px 0; }
.resizer:hover, .resizer.on { background: var(--ac); }

.center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabs { display: flex; height: 34px; flex: none; background: var(--bg-2); overflow-x: auto; scrollbar-width: none; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; border-right: 1px solid var(--line); color: var(--tx-3); cursor: pointer; white-space: nowrap; border-top: 2px solid transparent; }
.tab:hover { color: var(--tx); }
.tab.on { background: var(--bg); color: var(--tx); border-top-color: var(--ac); }
.tab .x { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; color: var(--tx-3); visibility: hidden; }
.tab:hover .x, .tab.on .x { visibility: visible; }
.tab .x:hover { background: var(--bg-4); color: var(--tx); }
.tabs-fill { flex: 1; border-bottom: 0; }
.crumbs { height: 24px; flex: none; display: flex; align-items: center; gap: 5px; padding: 0 14px; color: var(--tx-3); font-size: 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.crumbs b { color: var(--tx-2); font-weight: 500; }

.editor { flex: 1; min-height: 0; overflow: auto; position: relative; }
.code { font: var(--code-size)/1.6 var(--mono); padding: 8px 0 40px; min-width: max-content; }
.code.wrap { min-width: 0; }
.code.wrap .tx { white-space: pre-wrap; word-break: break-word; }
.ln { display: flex; }
.ln .no { flex: none; width: 48px; padding-right: 14px; text-align: right; color: var(--tx-3); user-select: none; }
.ln .sg { flex: none; width: 16px; text-align: center; color: var(--tx-3); user-select: none; }
.ln .tx { flex: 1; white-space: pre; padding-right: 24px; }
.ln.cur { background: var(--bg-2); }
.ln.cur .no { color: var(--tx); }
.ln.add { background: var(--add); } .ln.add .sg { color: var(--ok); }
.ln.del { background: var(--del); } .ln.del .sg { color: var(--err); } .ln.del .tx { opacity: .7; }
.t-kw { color: var(--s-kw); } .t-str { color: var(--s-str); } .t-num { color: var(--s-num); }
.t-com { color: var(--s-com); font-style: italic; } .t-fn { color: var(--s-fn); }
.t-prop { color: var(--s-prop); } .t-tag { color: var(--s-tag); }
.reviewbar { position: sticky; top: 0; left: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-3); border-bottom: 1px solid var(--line); }
.reviewbar .sp { flex: 1; }
.plus { color: var(--ok); } .minus { color: var(--err); }
.empty { height: 100%; display: grid; place-content: center; justify-items: center; gap: 10px; color: var(--tx-3); text-align: center; padding: 20px; }
.empty p { margin: 0; }
.doc { max-width: 720px; margin: 0 auto; padding: 28px 28px 60px; line-height: 1.6; font-size: 14px; }
.doc h1 { font-size: 22px; margin: 0 0 12px; } .doc h2 { font-size: 16px; margin: 22px 0 6px; } .doc h3 { font-size: 14px; margin: 16px 0 4px; }
.doc p { margin: 6px 0; color: var(--tx-2); } .doc ul { margin: 6px 0; padding-left: 20px; color: var(--tx-2); }
.doc code, .msg code { font: 12px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--bg-4); }
.doc li.chk { list-style: none; margin-left: -20px; padding-left: 24px; position: relative; }
.doc li.chk::before { content: ""; position: absolute; left: 0; top: 5px; width: 13px; height: 13px; border: 1.5px solid var(--tx-3); border-radius: 4px; }
.doc li.chk.on::before { background: var(--ok); border-color: var(--ok); }

/* Preview tab: a mock browser showing the sample app */
.browser { height: 100%; display: flex; flex-direction: column; }
.bbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
.url { flex: 1; height: 24px; display: flex; align-items: center; padding: 0 10px; border-radius: 12px; background: var(--bg-3); border: 1px solid var(--line); color: var(--tx-2); font-size: 12px; }
.bpage { flex: 1; overflow: auto; background: #f4f5f7; color: #1c1f26; --pv: #3b6cf6; --pv-r: 8px; }
.bpage.green { --pv: #0f9d7a; --pv-r: 999px; }
.pv-card { max-width: 420px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.pv-card h1 { margin: 0 0 14px; font-size: 22px; }
.pv-card input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid #d5d8de; border-radius: 8px; background: #fff; color: #1c1f26; }
.pv-card form { display: flex; gap: 8px; margin-top: 10px; }
.pv-card form button { background: var(--pv); color: #fff; padding: 0 16px; border-radius: var(--pv-r); font-weight: 600; }
.pv-card ul { list-style: none; margin: 14px 0 0; padding: 0; }
.pv-card li { padding: 9px 2px; border-top: 1px solid #eceef1; }
.pv-card li.none { color: #8a8f99; }

/* ---------- Bottom panel ---------- */
.panel { height: var(--pn-h); flex: none; display: flex; flex-direction: column; min-height: 0; }
.ptabs { display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 8px; flex: none; }
.ptabs button.pt { padding: 3px 9px; border-radius: 5px; color: var(--tx-3); font-size: 12px; }
.ptabs button.pt:hover { color: var(--tx); }
.ptabs button.pt[aria-pressed="true"] { color: var(--tx); background: var(--bg-4); }
.ptabs .sp { flex: 1; }
.pbody { flex: 1; min-height: 0; overflow: auto; font: 12px/1.6 var(--mono); padding: 2px 14px 8px; }
.tl { white-space: pre-wrap; } .tl.cmd { color: var(--tx); } .tl.dim { color: var(--tx-3); } .tl.ok { color: var(--ok); } .tl.err { color: var(--err); }
.tl.cmd::before, .tin::before { content: "notes-app $ "; color: var(--ac); }
.tin { display: flex; }
.tin input { flex: 1; background: none; border: 0; outline: 0; font: inherit; padding: 0; min-width: 0; }
.prob { display: flex; gap: 8px; align-items: center; width: 100%; padding: 3px 0; text-align: left; font-family: var(--sans); }
.prob:hover { color: var(--ac); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--tx-3); }
.dot.warn { background: var(--warn); } .dot.ok { background: var(--ok); } .dot.run { background: var(--ac); }

/* ---------- Agent panel and conversations ---------- */
.agent-pane { width: var(--ag-w); flex: none; display: flex; flex-direction: column; background: var(--bg-2); min-width: 0; }
.chat { flex: 1; min-height: 0; overflow: auto; padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.msg.user { align-self: flex-end; max-width: 90%; padding: 8px 12px; border-radius: 12px 12px 3px 12px; background: var(--bg-3); border: 1px solid var(--line); white-space: pre-wrap; }
.msg.agent .who { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 6px; color: var(--ac); }
.msg.agent p { margin: 6px 0; color: var(--tx-2); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.steps li { display: flex; align-items: center; gap: 8px; color: var(--tx-3); }
.steps li.done { color: var(--tx-2); }
.steps .st { width: 14px; height: 14px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line); color: var(--ok); }
.steps li.done .st { border-color: transparent; }
.steps li.now .st { border-color: var(--ac); border-top-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .steps li.now .st { animation: none; } }
.arts { display: grid; gap: 6px; margin-top: 8px; }
.art { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-3); }
.art:hover { border-color: var(--ac); }
.art .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.art small { color: var(--tx-3); font-family: var(--mono); }
.art .state { font-size: 11px; color: var(--tx-3); font-family: var(--sans); }
.welcome { margin: auto 0; display: grid; gap: 10px; justify-items: start; padding: 10px 0; }
.welcome h3 { margin: 0; font-size: 15px; } .welcome p { margin: 0; color: var(--tx-3); }
.chip { padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg-3); color: var(--tx-2); text-align: left; }
.chip:hover { border-color: var(--ac); color: var(--tx); }
.composer { margin: 0 12px 12px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-3); flex: none; }
.composer:focus-within { border-color: var(--ac); }
.composer textarea { display: block; width: 100%; border: 0; outline: 0; background: none; resize: none; padding: 2px 4px 6px; }
.comp-row { display: flex; align-items: center; gap: 6px; }
.comp-row select { height: 24px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-2); color: var(--tx-2); font-size: 12px; padding: 0 4px; }
.comp-row .sp { flex: 1; }
.send { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--ac); color: var(--ac-ink); }
.send:hover { filter: brightness(1.08); }

/* ---------- Manager view ---------- */
#managerView { display: grid; grid-template-columns: 270px minmax(0, 1fr) 290px; background: var(--bg); }
.mgr-list { background: var(--bg-2); border-right: 1px solid var(--line); padding: 12px; overflow: auto; }
.ws { margin: 12px 0 2px; color: var(--tx-3); font-size: 12px; } .ws b { color: var(--tx-2); font-weight: 600; }
.mgr-list .sub { padding: 14px 2px 5px; }
.task { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border-radius: 8px; text-align: left; color: var(--tx-2); }
.task:hover { background: var(--bg-4); } .task.on { background: var(--ac-soft); color: var(--tx); }
.task .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task small { color: var(--tx-3); }
.mgr-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mgr-head { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex: none; }
.mgr-head h2 { margin: 0; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--bg-4); color: var(--tx-2); white-space: nowrap; }
.pill.run { background: var(--ac-soft); color: var(--ac); } .pill.review { color: var(--warn); } .pill.done { color: var(--ok); }
.chat.wide { padding: 18px max(24px, calc(50% - 340px)) 18px; }
.composer.wide { margin: 0 max(24px, calc(50% - 340px)) 20px; }
.mgr-side { border-left: 1px solid var(--line); background: var(--bg-2); padding: 4px 12px 12px; overflow: auto; }
.mgr-side .sub { padding: 14px 2px 6px; }

/* ---------- Status bar ---------- */
.statusbar { display: flex; align-items: center; gap: 14px; padding: 0 10px; font-size: 11.5px; color: var(--tx-2); background: var(--bg-2); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.statusbar span, .statusbar button { display: flex; align-items: center; gap: 5px; }
.statusbar button:hover { color: var(--tx); }
.statusbar .sp { flex: 1; }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .35); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0; }
.pal { width: min(560px, 100%); background: var(--bg-3); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.pal input { width: 100%; height: 44px; padding: 0 16px; border: 0; outline: 0; background: none; border-bottom: 1px solid var(--line); font-size: 14px; }
.pal-list { max-height: 320px; overflow: auto; padding: 6px; }
.pal-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 7px; text-align: left; }
.pal-item small { margin-left: auto; color: var(--tx-3); }
.pal-item.on { background: var(--ac-soft); }
.menupop { position: fixed; z-index: 30; min-width: 210px; padding: 5px; background: var(--bg-3); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); }
.menupop button { display: flex; justify-content: space-between; gap: 20px; width: 100%; padding: 6px 10px; border-radius: 6px; text-align: left; }
.menupop button:hover { background: var(--ac-soft); }
.menupop small { color: var(--tx-3); }

/* ---------- Toggled regions and small screens ---------- */
#app.no-sidebar .sidebar, #app.no-sidebar [data-resize="sidebar"] { display: none; }

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ===== Icons (inline SVG paths, 24px grid) ===== */

/* ===== Sample project (the "workspace") ===== */
const files = {
  'index.html': { lang: 'html', text: `<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

  </head>

  'src/app.js': { lang: 'js', text: `import { loadNotes, saveNote } from "./api.js";

const list = document.querySelector("#notes");
const form = document.querySelector("#new-note");

let notes = [];

function render(items) {
  list.innerHTML = "";
  for (const note of items) {
    const li = document.createElement("li");
    li.textContent = note.title;
    list.appendChild(li);
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const title = form.elements.title.value.trim();
  if (!title) return;
  notes.push(await saveNote({ title }));
  form.reset();
  render(notes);
});

async function start() {
  notes = await loadNotes();
  render(notes);
}

start();` },
  'src/api.js': { lang: 'js', text: `const KEY = "notes";

// Notes are kept in the browser, so there is no server to run.
export async function loadNotes() {
  const raw = localStorage.getItem(KEY);
  return raw ? JSON.parse(raw) : [];
}

export async function saveNote(note) {
  const notes = await loadNotes();
  const saved = { id: Date.now(), ...note };
  localStorage.setItem(KEY, JSON.stringify([...notes, saved]));
  return saved;
}` },

/* Documents the agent produces (plans, walkthroughs). Opened as read-only tabs. */
const docs = {

Tessera is a single HTML file that imitates how an agentic IDE works. It is meant for studying the layout and the wiring, so everything is simulated.

/* ===== Application state (in memory only) ===== */
const state = {

  side: 'explorer',
  open: { src: true, tests: true },                 // expanded folders
  tabs: [{ id: 'file:src/app.js', kind: 'file', path: 'src/app.js' }, { id: 'file:index.html', kind: 'file', path: 'index.html' }],

/* ===== Syntax highlighting: one regex per language, one line at a time ===== */
const RX = {
  js: [/(\/\/.*$)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|async|await|new|class|try|catch|throw|of|in|null|undefined|true|false)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_$][\w$]*)(?=\s*\()/g,
    ['com', 'str', 'kw', 'num', 'fn']],
  css: [/(\/\*.*?\*\/)|("[^"]*"|'[^']*')|(#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|rem|em|%|ms|s|fr|vh|vw)?)|(--[\w-]+|[\w-]+)(?=\s*:)|([.#:]?[\w-]+)(?=\s*\{)/g,
    ['com', 'str', 'num', 'prop', 'tag']],
  html: [/(<!--.*?-->)|(<!?\/?[\w-]+|\/?>)|([\w-]+)(?==)|("[^"]*")/g, ['com', 'tag', 'prop', 'str']],
  json: [/("(?:\\.|[^"\\])*")(?=\s*:)|("(?:\\.|[^"\\])*")|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g, ['prop', 'str', 'kw', 'num']],
  md: [/^(#{1,6} .*)$|(`[^`]+`)|^(\s*- )/g, ['kw', 'str', 'num']]
};
function hl(line, lang) {
  const rule = RX[lang];
  if (!rule) return esc(line);
  const [re, cls] = rule;
  re.lastIndex = 0;
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    if (!m[0]) { re.lastIndex++; continue; }
    let g = 1;
    while (g < m.length && m[g] === undefined) g++;
    out += esc(line.slice(last, m.index)) + `<span class="t-${cls[g - 1]}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(line.slice(last));
}

/* Small Markdown renderer for agent documents: headings, lists, checkboxes, inline code. */
function md(src) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  let html = '', list = false;
  for (const line of src.split('\n')) {
    const li = /^- (\[( |x)\] )?(.*)$/.exec(line);
    if (li) {
      if (!list) { html += '<ul>'; list = true; }
      html += li[1] ? `<li class="chk${li[2] === 'x' ? ' on' : ''}">${inline(li[3])}</li>` : `<li>${inline(li[3])}</li>`;
      continue;
    }
    if (list) { html += '</ul>'; list = false; }
    const h = /^(#{1,3}) (.*)$/.exec(line);
    if (h) html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (list ? '</ul>' : '');
}

/* Line diff (longest common subsequence). Fine for small files. */
function diffLines(a, b) {
  const A = a.split('\n'), B = b.split('\n'), n = A.length, m = B.length;
  const t = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i][j] = A[i] === B[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push({ t: ' ', s: A[i] }); i++; j++; }
    else if (t[i + 1][j] >= t[i][j + 1]) out.push({ t: '-', s: A[i++] });
    else out.push({ t: '+', s: B[j++] });
  }
  while (i < n) out.push({ t: '-', s: A[i++] });
  while (j < m) out.push({ t: '+', s: B[j++] });
  return out;
}
const diffStat = d => ({ add: d.filter(x => x.t === '+').length, del: d.filter(x => x.t === '-').length });

/* ===== Things derived from file contents ===== */
const hasSearch = () => files['src/app.js'].text.includes('#search') && files['index.html'].text.includes('id="search"');

/* ===== Renderers ===== */
const ftBadge = { js: 'JS', css: '#', html: '<>', json: '{}', md: 'M↓' };
function fileRow(path, depth) {

}

function renderSide() {
  const titles = { explorer: 'Explorer', search: 'Search', scm: 'Source control', ext: 'Extensions', settings: 'Settings' };

  const body = $('#sideBody');
  if (state.side === 'explorer') {
    const dirs = {}, root = [];
    for (const p of Object.keys(files)) { const i = p.indexOf('/'); i < 0 ? root.push(p) : (dirs[p.slice(0, i)] ||= []).push(p); }
    let h = '<div class="sub">notes-app</div>';
    for (const d of Object.keys(dirs).sort()) {
      h += `<button class="row dir${state.open[d] ? ' open' : ''}" data-act="dir" data-dir="${d}"><span class="chev">${ic('chevron', 12)}</span>${ic('folder', 14)}<span class="nm">${d}</span></button>`;

function sendPrompt(text, mode) {
  text = text.trim();
  if (!text) return;
  let task = curTask();
  if (!task) {
    task = { id: ++seq, title: text.length > 44 ? text.slice(0, 44) + '…' : text, status: 'running', when: 'now', msgs: [] };
    tasks.unshift(task);
    state.activeTask = task.id;
  }
  const sc = SCENARIOS.find(s => s.match.test(text));
  const fast = mode === 'fast';
  const msg = { role: 'agent', text: '', artifacts: [], steps: (fast ? sc.steps.slice(-2) : sc.steps).map(label => ({ label, done: false })) };
  task.msgs.push({ role: 'user', text }, msg);
  task.status = 'running';
  log(`[agent] task ${task.id} started: ${sc.title}`);
  renderTasks();

  let i = 0;
  const tick = () => {
    if (i < msg.steps.length) { msg.steps[i++].done = true; renderTasks(); setTimeout(tick, 650); return; }
    // All steps done: stage the proposed edits for review.
    for (const ch of sc.changes) {
      const f = files[ch.path], base = f.pending ? f.pending.text : f.text, next = ch.apply(base, text);
      if (next === base) continue;
      f.pending = { text: next };
      msg.artifacts.push({ kind: 'diff', path: ch.path, ...diffStat(diffLines(f.text, next)) });
    }
    if (!msg.artifacts.length) {
      msg.text = 'That change is already in the workspace, so there is nothing new to review.';
      task.status = 'done';
    } else {
      if (!fast) {
        const id = `plan-${task.id}-${task.msgs.length}`;
        docs[id] = { title: 'Plan: ' + sc.title, md: sc.plan };
        msg.artifacts.unshift({ kind: 'doc', id, label: 'Implementation plan' });
      }
      msg.text = sc.summary;
      task.status = 'review';
      if (state.view === 'editor') openFile(msg.artifacts.find(a => a.kind === 'diff').path);
    }
    log(`[agent] task ${task.id} ${task.status === 'review' ? 'is waiting for review' : 'finished'}`);
    renderAll();
  };
  setTimeout(tick, 650);
}

/* Accept or reject a proposed change, then close any task with nothing left to review. */
function resolve(path, accepted) {
  const f = files[path];
  if (!f.pending) return;
  if (accepted) { f.text = f.pending.text; state.modified.add(path); }
  delete f.pending;
  for (const t of tasks) {
    const diffs = t.msgs.flatMap(m => m.artifacts || []).filter(a => a.kind === 'diff');
    diffs.filter(a => a.path === path && !a.state).forEach(a => a.state = accepted ? 'Accepted' : 'Rejected');
    if (t.status === 'review' && diffs.every(a => a.state)) t.status = 'done';
  }
  log(`[review] ${accepted ? 'accepted' : 'rejected'} ${path}`);
  renderAll();
}

const MENUS = {
  File: [['New agent task', COMMANDS[0][1]], ['Open preview', openPreview], ['Close tab', () => state.active && closeTab(state.active)]],
  Edit: [['Find in files', () => { state.side = 'search'; $('#app').classList.remove('no-sidebar'); setView('editor'); renderSide(); }], ['Command palette', palOpen, 'Ctrl K']],
  View: [['Editor', () => setView('editor')], ['Manager', () => setView('manager')], ['Toggle sidebar', () => toggle('sidebar'), 'Ctrl B'], ['Toggle panel', () => toggle('panel'), 'Ctrl J'], ['Toggle agent panel', () => toggle('agent')], ['Switch theme', flipTheme]],
  Run: [['Start dev server', () => runCmd('npm run dev')], ['Run tests', () => runCmd('npm test')]],
  Help: [['About this prototype', () => openDoc('about')]]
};
let menuItems = [];
function menuOpen(name, anchor) {
  const pop = $('#menuPop'), r = anchor.getBoundingClientRect();
  menuItems = MENUS[name];
  pop.innerHTML = menuItems.map((m, i) => `<button data-act="menu-item" data-i="${i}">${m[0]}${m[2] ? `<small>${m[2]}</small>` : ''}</button>`).join('');
  pop.style.left = r.left + 'px'; pop.style.top = r.bottom + 4 + 'px';
  pop.hidden = false;
}
const focusComposer = () => { const t = $((state.view === 'editor' ? '.agent-pane' : '.mgr-main') + ' textarea'); if (t) t.focus(); };
function submitComposer(box) {
  const ta = $('textarea', box);
  sendPrompt(ta.value, $('[data-mode]', box).value);
  ta.value = '';
}

/* ===== Events: one delegated click handler keyed on data-act ===== */
const ACT = {
  menu: (d, el) => menuOpen(d.menu, el),
  'menu-item': d => { $('#menuPop').hidden = true; menuItems[d.i][1](); },
  palette: palOpen,
  pal: d => palRun(+d.i),
  view: d => setView(d.view),
  toggle: d => toggle(d.what),
  theme: flipTheme,
  side: d => {
    const app = $('#app');
    if (state.side === d.side && !app.classList.contains('no-sidebar')) app.classList.add('no-sidebar');   // click the active icon to collapse
    else { state.side = d.side; app.classList.remove('no-sidebar'); renderSide(); }
  },
  dir: d => { state.open[d.dir] = !state.open[d.dir]; renderSide(); },
  'open-file': d => openFile(d.path, d.line),
  'open-doc': d => openDoc(d.doc),
  tab: d => { state.active = d.id; renderSide(); renderTabs(); renderEditor(); },
  'close-tab': d => closeTab(d.id),
  ptab: d => { state.ptab = d.tab; $('#app').classList.remove('no-panel'); renderPanel(); },
  accept: d => resolve(d.path, true),
  reject: d => resolve(d.path, false),
  run: d => runCmd(d.cmd),
  'pv-reload': () => renderEditor(),
  task: d => { state.activeTask = +d.id; renderTasks(); },
  'task-new': () => { state.activeTask = null; renderTasks(); focusComposer(); },
  chip: (d, el) => sendPrompt(el.textContent, $((state.view === 'editor' ? '.agent-pane' : '.mgr-main') + ' [data-mode]').value),
  send: (d, el) => submitComposer(el.closest('[data-composer]')),
  commit: () => {
    const n = state.modified.size, msg = $('#commitMsg').value.trim() || 'Update notes app';
    state.modified.clear();
    log(`[git] committed ${n} file${n === 1 ? '' : 's'}: ${msg}`);
    renderSide(); renderStatus();
  },
  install: (d, el) => { el.textContent = el.textContent === 'Install' ? 'Installed' : 'Install'; }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!$('#menuPop').hidden && !(el && el.dataset.act === 'menu')) $('#menuPop').hidden = true;
  if (e.target.id === 'palette') palClose();
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el.dataset, el, e);
});
$('#editor').addEventListener('click', e => {          // click a line to move the cursor
  const ln = e.target.closest('.ln[data-n]'), tab = state.tabs.find(t => t.id === state.active);
  if (!ln || !tab || tab.kind !== 'file' || String(getSelection())) return;
  state.cursor[tab.path] = +ln.dataset.n;
  $$('#editor .ln.cur').forEach(x => x.classList.remove('cur'));
  ln.classList.add('cur');
  renderStatus();
});
$('#pbody').addEventListener('click', e => { if (state.ptab === 'terminal' && !String(getSelection()) && !e.target.closest('button')) $('#termIn').focus(); });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'palInput') { palSel = 0; palRender(); }
  else if (t.id === 'pvSearch') { state.pvQuery = t.value; $('#pvList').innerHTML = pvList(); }
  else if (t.id === 'fontSize') document.documentElement.style.setProperty('--code-size', t.value + 'px');
  else if (t.id === 'wrapToggle') { state.wrap = t.checked; renderEditor(); }
  else if (t.id === 'searchInput') {
    const q = t.value.toLowerCase(), hits = [];
    if (q) for (const [path, f] of Object.entries(files)) f.text.split('\n').forEach((l, i) => { if (l.toLowerCase().includes(q)) hits.push({ path, n: i + 1, l: l.trim() }); });
    $('#searchRes').innerHTML = !q ? '<p class="hint">Type to search every file in the workspace.</p>'
      : hits.map(h => `<button class="res" data-act="open-file" data-path="${h.path}" data-line="${h.n}"><b>${h.path}:${h.n}</b><code>${esc(h.l)}</code></button>`).join('') || '<p class="hint">No results.</p>';
  }
});
document.addEventListener('submit', e => {              // the form inside the preview
  e.preventDefault();
  if (e.target.id !== 'pvForm') return;
  const v = e.target.elements.title.value.trim();
  if (v) { state.pvNotes.push(v); e.target.reset(); $('#pvList').innerHTML = pvList(); }
});
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase(), t = e.target;
  if (mod && (k === 'k' || k === 'p')) { e.preventDefault(); palOpen(); }
  else if (mod && k === 'b') { e.preventDefault(); toggle('sidebar'); }
  else if (mod && k === 'j') { e.preventDefault(); toggle('panel'); }
  else if (k === 'escape') { palClose(); $('#menuPop').hidden = true; }
  else if (t.id === 'palInput' && (k === 'arrowdown' || k === 'arrowup')) { e.preventDefault(); palSel += k === 'arrowdown' ? 1 : -1; palRender(); }
  else if (t.id === 'palInput' && k === 'enter') palRun(palSel);
  else if (t.id === 'termIn' && k === 'enter') runCmd(t.value);
  else if (t.matches('[data-composer] textarea') && k === 'enter' && !e.shiftKey) { e.preventDefault(); submitComposer(t.closest('[data-composer]')); }
  else if (t.matches('.tab') && (k === 'enter' || k === ' ')) { e.preventDefault(); t.click(); }
});

/* Drag the thin dividers to resize the sidebar, agent panel and bottom panel. */
$$('.resizer').forEach(r => r.addEventListener('pointerdown', e => {
  const app = $('#app'), kind = r.dataset.resize;
  r.setPointerCapture(e.pointerId); r.classList.add('on');
  const move = ev => {
    if (kind === 'sidebar') app.style.setProperty('--sb-w', clamp(ev.clientX - 48, 160, 480) + 'px');
    else if (kind === 'agent') app.style.setProperty('--ag-w', clamp(innerWidth - ev.clientX, 260, 640) + 'px');
    else { const c = $('.center').getBoundingClientRect(); app.style.setProperty('--pn-h', clamp(c.bottom - ev.clientY, 70, c.height - 120) + 'px'); }
  };
  const up = () => { r.classList.remove('on'); r.removeEventListener('pointermove', move); r.removeEventListener('pointerup', up); };
  r.addEventListener('pointermove', move); r.addEventListener('pointerup', up);
}));

/* ===== Start ===== */
$$('i[data-ic]').forEach(i => { i.outerHTML = ic(i.dataset.ic, +i.dataset.size || 16); });
setTheme(matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
if (innerWidth < 1000) $('#app').classList.add('no-sidebar');
if (innerWidth < 760) $('#app').classList.add('no-agent');
renderAll();
</script>
</body>
</html>
